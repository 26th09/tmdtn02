# ===================================================================
# StayTour — Docker Compose: MySQL + Backend (API) + Frontend (web)
# Chạy tất cả bằng 1 lệnh:  docker compose up -d --build
# Web khách     : https://localhost:8443   (http://localhost:8080 tự chuyển sang https)
# Khu vực admin : https://localhost:8443/admin   (admin / Admin@123456)
# API           : nội bộ, truy cập qua https://localhost:8443/api
#                 (nginx chuyển tiếp — không cần mở cổng 4000 ra ngoài)
# HTTPS dùng chứng chỉ TỰ KÝ (sinh lúc build) -> trình duyệt cảnh báo 1 lần, bấm "Proceed".
# ===================================================================
services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: staytour123
      MYSQL_DATABASE: tmdt
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pstaytour123"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    # Nạp thêm biến môi trường từ backend/.env (SMTP email, Google login, VNPAY...).
    # required:false => máy nào chưa có .env vẫn chạy bình thường (chế độ DEV).
    # Lưu ý: các biến trong "environment:" bên dưới luôn được ưu tiên hơn .env.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: "mysql://root:staytour123@db:3306/tmdt"
      JWT_SECRET: "doi_thanh_chuoi_ngau_nhien_cua_ban"
      JWT_EXPIRES_IN: "7d"
      ADMIN_JWT_SECRET: "doi_thanh_chuoi_ngau_nhien_khac"
      ADMIN_JWT_EXPIRES_IN: "8h"
      PORT: "4000"
      # URL công khai của web. Mặc định localhost:8080 (chỉ máy chủ dùng được).
      # Để người dùng máy KHÁC (LAN) dùng FULL tính năng — nhất là VNPAY chuyển hướng về —
      # đặt PUBLIC_URL trong file .env ở gốc repo, ví dụ: PUBLIC_URL=http://192.168.1.50:8080
      CLIENT_URL: "${PUBLIC_URL:-http://localhost:8080}"
      # Trình duyệt truy cập API/ảnh qua cổng web 8080 (nginx chuyển tiếp).
      BACKEND_URL: "${PUBLIC_URL:-http://localhost:8080}"
      SEED_ADMIN_USERNAME: "admin"
      SEED_ADMIN_PASSWORD: "Admin@123456"
    depends_on:
      db:
        condition: service_healthy
    # Không mở cổng 4000 ra máy host nữa — backend chỉ dùng nội bộ (service "backend").
    # (Muốn gọi API trực tiếp khi phát triển thì tự thêm lại: ports: ["4000:4000"].)
    expose:
      - "4000"
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Để trống = trình duyệt gọi API cùng origin (nginx chuyển tiếp sang backend).
        # Nhờ vậy không phụ thuộc cổng 4000 và chạy được trên mọi host.
        VITE_API_URL: ""
        # Tên/IP hợp lệ trên chứng chỉ tự ký. Mặc định localhost; thêm IP LAN qua .env
        # gốc để trình duyệt máy khác chấp nhận, vd:
        #   SSL_SAN=DNS:localhost,IP:127.0.0.1,IP:192.168.1.50
        SSL_SAN: "${SSL_SAN:-DNS:localhost,IP:127.0.0.1}"
    depends_on:
      - backend
    ports:
      - "8080:80"   # HTTP -> tự chuyển hướng sang HTTPS
      - "8443:443"  # HTTPS (truy cập chính)
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
